# Source unique pour la liste des stations Madrid — voir REVISION_BRIEF.md
# et AUDIT.md §1. Ordre alphabétique : identique à l'ordre canonique produit
# par 06_train_multistation.py::load_madrid_data (sorted(full_df['station'].unique()))
# — NE PAS RÉORDONNER, l'ordre détermine l'indexation des nœuds du graphe.
#
# MENDEZ ALVARO : PM2.5 CONSTANT sur la période d'ENTRAÎNEMENT (variance
# nulle, std=0.0) mais passe le filtre qualité car celui-ci porte sur la
# variance de la période de TEST (qui, elle, varie normalement — cf.
# diagnostic dans REVISION_BRIEF.md / rapport de tâche P1). Politique du
# manuscrit (§3.3) : CONSERVÉE dans le benchmark de prévision (le graphe et
# l'agrégat R² l'incluent, Madrid = 7 stations), EXCLUE uniquement de
# l'analyse station-level d'hétérophilie (§5.5) car la corrélation locale
# train-period y est indéfinie (NaN) pour une série constante.
#
# Cette politique est correcte et volontaire — NE PAS "corriger" en excluant
# MENDEZ ALVARO du benchmark, ni en l'incluant dans l'analyse hétérophilie.
city: madrid
source: "OpenAQ API v3 + Open-Meteo Historical Weather, post quality filtering"
stations:
